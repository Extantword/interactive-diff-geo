<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Superficies regulares</title>
    <script type="module" crossorigin src="/interactive-diff-geo/assets/index-B9lXsEHe.js"></script>
    <link rel="stylesheet" crossorigin href="/interactive-diff-geo/assets/index-DXK_UGNs.css">
  </head>
  <body>
    <div class="deck">
      <section class="chart-panel"></section>
      <main class="stage">
        <canvas id="sphere"></canvas>
        <div class="caption"></div>
        <p class="step-note"></p>
        <div class="surface-name" hidden></div>
        <div class="marker" hidden>
          <span class="marker__dot"></span><span class="marker__label"></span>
        </div>
      </main>
      <aside class="aside">
        <div class="aside__inner">
          <div class="aside__lead">
            <h2 class="heading"></h2>
            <p class="question"></p>
          </div>
          <div class="formulas"></div>
          <p class="note"></p>
          <ol class="steps"></ol>
          <div class="controls"></div>
        </div>
      </aside>
    </div>
    <section class="sheet">
      <div class="sheet__inner">
        <h1 class="sheet__title"></h1>
        <div class="sheet__lead"></div>
        <ol class="sheet__items"></ol>
      </div>
    </section>
    <section class="board"></section>
    <header class="running-head">Superficies regulares</header>
    <footer class="foot">
      <span class="hint">arrastra para girar · rueda para acercar · ← → diapositivas · R vista inicial</span>
      <span class="counter"></span>
    </footer>
  </body>
</html>
